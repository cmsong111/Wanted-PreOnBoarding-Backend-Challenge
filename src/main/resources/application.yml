spring:
  application:
    name: portfolio

  config:
    import: optional:file:.env[.properties]

  profiles:
    default: local

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  data:
    redis:
      host: localhost
      port: 6379
      database: 2

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:dummy-api-key}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.8-flash}
            temperature: 0.7

jwt:
  secret: ${JWT_SECRET:this-is-a-secret-key-and-it-should-be-kept-secure}
  issuer: ${JWT_ISSUER:localhost}
  access-expiry: ${JWT_ACCESS_EXPIRATION:3600}
  refresh-expiry: ${JWT_REFRESH_EXPIRATION:604800}


springdoc:
  swagger-ui:
    tags-sorter: alpha

server:
  shutdown: graceful
  servlet:
    encoding:
      force-response: true # 한글 인코딩 반환 강제화

storage:
  imgbb:
    api-key: ${IMGBB_API_KEY:your-api-key}

logging:
  file:
    name: ./logs/application.log
  logback:
    rollingpolicy:
      file-name-pattern: ./logs/application.%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30

spring:
  application:
    name: portfolio

  profiles:
    default: local

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

jwt:
  secret: ${JWT_SECRET:this-is-a-secret-key-and-it-should-be-kept-secure}
  issuer: ${JWT_ISSUER:article.cmsong111.site}
  expiry: ${JWT_EXPIRATION:3600000}


springdoc:
  swagger-ui:
    tags-sorter: alpha

server:
  servlet:
    encoding:
      force-response: true # 한글 인코딩 반환 강제화

storage:
  imgbb:
    api-key: ${IMGBB_API_KEY:your-api-key}



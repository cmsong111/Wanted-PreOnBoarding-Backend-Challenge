spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop  # DB가 초기화되고 테스트 후 드롭됨
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    defer-datasource-initialization: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 2

  sql:
    init:
      mode: never

  ai:
    google:
      genai:
        api-key: test-dummy-api-key
        chat:
          options:
            model: gemini-3.8-flash

jwt:
  secret: ${JWT_SECRET:this-is-a-secret-key-and-it-should-be-kept-secure}
  issuer: ${JWT_ISSUER:localhost}
  access-expiry: ${JWT_ACCESS_EXPIRATION:3600}
  refresh-expiry: ${JWT_REFRESH_EXPIRATION:604800}
